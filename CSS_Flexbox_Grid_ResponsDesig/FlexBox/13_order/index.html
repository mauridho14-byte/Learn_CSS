<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            gap:10px;
        }
        .item{
            padding:20px;
            background-color: lightblue;
        }

        .a{
            order:0;
        }
        .b{
            order:2;
        }
        .c{
            order:-1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item a">A</div>
        <div class="item b">B</div>
        <div class="item c">C</div>
    </div>
</body>
</html>
