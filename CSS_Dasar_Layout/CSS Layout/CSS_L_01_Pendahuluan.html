    <!-- 
    ===POSITION===
    1.Static
        -mengikuti alur seperti biasa
        -ini namanya normal flow
        -mengikuti urutan setelah-setelah nya
    2.Relative
        -sebelum dirubah,maka posisi awalnya static
        -menggunakan position:relative
    3.Absolute
        -awalnya static dulu sebelum diberikan absolute
        -setelah ditambahkan absolute,maka original position
         nya akan menghilang,diisikan oleh komponen setelahnya
        -posisinaya akan mengikuti posisi browsernya,bukan posisi
         awalnya
    4.Sticky
        -campuran static dan fixed
        -ketika awalnya posisi ditengah,saat dischrool ke atas
         maka dia akan tetap ditampilan atas,jadi keliatan di layar
    5.Fixed
        -dia akan mirip dengan absolute
        -bedanya,saat ngeschroll,posisi fix ini akan tetap
         saat di schrool
    -->
